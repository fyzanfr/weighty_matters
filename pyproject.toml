[project]
name = "weighty-matters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fyzan", email = "finamdar204@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "datasets",
    "scikit-learn",
    "torch",
    "transformers",
]

[project.scripts]
weighty-matters = "weighty_matters:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
